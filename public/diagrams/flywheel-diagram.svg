<svg viewBox="0 0 1200 940" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" style="background:#0b0d10" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Flywheel options wheel cycle</title>
  <desc>Idle, sell a cash-secured put, either keep the premium and repeat or get assigned the stock, then sell covered calls and repeat until the shares get called away, which restarts the cycle at Idle. Below the cycle: a real NBIS trade the bot placed that went sell put, assigned, then five covered calls.</desc>

  <rect width="1200" height="940" fill="#0b0d10"/>

  <text x="600" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#f5f5f5">The Flywheel Cycle</text>
  <text x="600" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#9aa0a6">Income from selling options, repeating whether the stock goes up, down, or nowhere</text>

  <defs>
    <marker id="fwArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/>
    </marker>
    <marker id="fwArrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ade80"/>
    </marker>
  </defs>

  <!-- IDLE box (left) -->
  <rect x="60" y="200" width="220" height="130" rx="14" fill="#151a21" stroke="#3b4552" stroke-width="2"/>
  <text x="170" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#f5f5f5">IDLE</text>
  <text x="170" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#9aa0a6">No position.</text>
  <text x="170" y="296" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#9aa0a6">Ready to sell a put.</text>

  <line x1="280" y1="245" x2="352" y2="215" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#fwArrow)"/>
  <text x="316" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#7dd3fc">Sell Put</text>

  <!-- CSP box (middle) -->
  <rect x="355" y="150" width="240" height="130" rx="14" fill="#151a21" stroke="#3b4552" stroke-width="2"/>
  <text x="475" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#f5f5f5">Short Put (CSP)</text>
  <text x="475" y="221" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#9aa0a6">Collect premium upfront,</text>
  <text x="475" y="239" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#9aa0a6">agree to buy if it drops</text>

  <!-- CSP self-loop -->
  <path d="M 400,150 C 400,80 550,80 550,150" fill="none" stroke="#4ade80" stroke-width="2.2" marker-end="url(#fwArrowGreen)"/>
  <text x="475" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#4ade80">Expires worthless, or closed at 70% profit</text>
  <text x="475" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#c7cdd4">→ keep the premium, sell a new put</text>

  <line x1="595" y1="230" x2="667" y2="245" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#fwArrow)"/>
  <text x="640" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#7dd3fc">Assigned</text>
  <text x="640" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#7dd3fc">(stock dropped)</text>

  <!-- CC box (right) -->
  <rect x="670" y="200" width="250" height="130" rx="14" fill="#151a21" stroke="#3b4552" stroke-width="2"/>
  <text x="795" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#f5f5f5">Own Shares +</text>
  <text x="795" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#f5f5f5">Short Call (CC)</text>
  <text x="795" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#9aa0a6">Sell calls against the shares</text>

  <!-- CC self-loop -->
  <path d="M 750,200 C 750,130 900,130 900,200" fill="none" stroke="#4ade80" stroke-width="2.2" marker-end="url(#fwArrowGreen)"/>
  <text x="825" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#4ade80">Expires worthless, or closed at 70% profit</text>
  <text x="825" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#c7cdd4">→ keep the shares, sell a new call</text>

  <!-- Return arrow: CC back to IDLE (called away) -->
  <path d="M 795,332 C 795,430 170,430 170,332" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#fwArrow)"/>
  <text x="480" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#f59e0b">Called away — shares sold at the strike, cycle restarts at IDLE</text>

  <!-- Bottom caption -->
  <text x="600" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#c7cdd4">Runs on 4 stocks at once. Every outcome collects a premium — the only question is which stage happens next.</text>

  <!-- REAL TRADE box: NBIS sell put -> assigned -> covered calls (from flywheel/wheel_state.json) -->
  <rect x="60" y="545" width="1080" height="370" rx="10" fill="#151a21" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="600" y="573" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#f5f5f5">Real trade placed by the bot: NBIS — sold a put, got assigned, then sold covered calls</text>
  <text x="600" y="592" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#9aa0a6">All 1 contract (100 shares) · numbers from the bot’s own trade history · as of Oct 1, 2026</text>
  <rect x="80" y="610" width="270" height="200" rx="10" fill="#0f1318" stroke="#3b4552" stroke-width="1.5"/>
  <text x="95" y="638" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#7dd3fc">① Sell a cash-secured put</text>
  <text x="95" y="664" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#9aa0a6">Jun 22, 2026</text>
  <text x="95" y="688" text-anchor="start" font-family="Arial, sans-serif" font-size="13" fill="#f5f5f5">NBIS $225 put, expiring Jul 10</text>
  <text x="95" y="716" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#9aa0a6">Premium collected</text>
  <text x="95" y="740" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#4ade80">+$797</text>
  <text x="95" y="762" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#9aa0a6">($7.97/share × 100)</text>
  <line x1="352" y1="710" x2="376" y2="710" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#fwArrow)"/>
  <rect x="380" y="610" width="260" height="200" rx="10" fill="#0f1318" stroke="#3b4552" stroke-width="1.5"/>
  <text x="395" y="638" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#7dd3fc">② Stock dropped → assigned</text>
  <text x="395" y="664" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#9aa0a6">Jul 15, 2026</text>
  <text x="395" y="688" text-anchor="start" font-family="Arial, sans-serif" font-size="13" fill="#f5f5f5">Bought 100 shares at $225</text>
  <text x="395" y="716" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#9aa0a6">Effective cost per share</text>
  <text x="395" y="740" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#f5f5f5">$217.03</text>
  <text x="395" y="762" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#9aa0a6">($225 strike − $7.97 put premium)</text>
  <line x1="642" y1="710" x2="666" y2="710" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#fwArrow)"/>
  <rect x="670" y="610" width="450" height="200" rx="10" fill="#0f1318" stroke="#3b4552" stroke-width="1.5"/>
  <text x="685" y="638" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#7dd3fc">③ Sell covered calls against the shares</text>
  <text x="685" y="662" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#7dd3fc">Sold</text>
  <text x="765" y="662" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#7dd3fc">Call strike</text>
  <text x="840" y="662" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#7dd3fc">Expiry</text>
  <text x="925" y="662" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#7dd3fc">Premium</text>
  <text x="1000" y="662" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#7dd3fc">Result</text>
  <text x="685" y="684" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#c7cdd4">Jul 15</text>
  <text x="765" y="684" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#c7cdd4">$250</text>
  <text x="840" y="684" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#c7cdd4">Jul 31</text>
  <text x="925" y="684" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#c7cdd4">$652</text>
  <text x="1000" y="684" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#4ade80">+$459.55 (70% close)</text>
  <text x="685" y="706" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#c7cdd4">Jul 24</text>
  <text x="765" y="706" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#c7cdd4">$235</text>
  <text x="840" y="706" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#c7cdd4">Aug 7</text>
  <text x="925" y="706" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#c7cdd4">$717</text>
  <text x="1000" y="706" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#4ade80">+$717 (expired)</text>
  <text x="685" y="728" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#c7cdd4">Aug 10</text>
  <text x="765" y="728" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#c7cdd4">$245</text>
  <text x="840" y="728" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#c7cdd4">Aug 28</text>
  <text x="925" y="728" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#c7cdd4">$638</text>
  <text x="1000" y="728" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#4ade80">+$479 (70% close)</text>
  <text x="685" y="750" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#c7cdd4">Aug 24</text>
  <text x="765" y="750" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#c7cdd4">$242.50</text>
  <text x="840" y="750" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#c7cdd4">Sep 11</text>
  <text x="925" y="750" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#c7cdd4">$495</text>
  <text x="1000" y="750" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#4ade80">+$366.50 (70% close)</text>
  <text x="685" y="772" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#c7cdd4">Sep 1</text>
  <text x="765" y="772" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#c7cdd4">$227.50</text>
  <text x="840" y="772" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#c7cdd4">Sep 18</text>
  <text x="925" y="772" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#c7cdd4">$386</text>
  <text x="1000" y="772" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#4ade80">+$386 (expired)</text>
  <text x="685" y="794" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#c7cdd4">Sep 28</text>
  <text x="765" y="794" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#c7cdd4">$265</text>
  <text x="840" y="794" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#c7cdd4">Oct 16</text>
  <text x="925" y="794" text-anchor="start" font-family="Arial, sans-serif" font-size="12" fill="#c7cdd4">$557</text>
  <text x="1000" y="794" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">OPEN</text>
  <text x="600" y="846" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#4ade80">Premium banked so far on NBIS: $3,205.05 — 1 put + 5 covered calls, every one kept</text>
  <text x="600" y="870" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#c7cdd4">The 100 shares are still held (about $233.80 on Oct 1 vs. $225 paid), and a 6th call is open — they haven’t been called away yet, so the wheel keeps turning.</text>
  <text x="600" y="890" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9aa0a6">GLW followed the same path: $150 put → assigned Jul 27 → 5 covered calls so far.</text>
</svg>

  <text x="600" y="676" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#f5f5f5">Actual trades placed by the bot (Strategy: Long Strangle — buy 1 call + 1 put, exit both legs at ±20% combined P&amp;L)</text>
  <text x="600" y="694" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#9aa0a6">Stock price = closing price on the entry date · Cost/share = call + put premium paid · all trades 1 contract (×100 shares)</text>
